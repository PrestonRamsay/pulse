# Re-tuning the history network (instructor, 2026-11-24): the dropout, embedding and learning-rate
# sweeps were done on the schedule-only net. Same as latenet_history_apr_aug.yaml, one change:
# dropout 0.3 (was 0.1). Validation only; seed 0. A winner then runs seeds 1-3 for the selection rule.
experiment: pulse-late-3min
run_name: tune_dropout03
seed: 0

model:
  embedding_dims:        # size of each learned vector; vocab sizes are 155 / 1163 / 24 / 7 / 3
    route_id: 16
    stop_id: 32
    hour: 8
    day_of_week: 4
    point_type: 2
  hidden: [256, 128]     # two hidden layers
  dropout: 0.3

train:
  batch_size: 8192
  learning_rate: 0.003 
  weight_decay: 0.0
  max_epochs: 20
  patience: 3            # stop after 3 epochs without a better validation AUC
  min_delta: 0.0005      # an improvement smaller than this doesn't count
  threshold: 0.5         # for validation accuracy

history:
  windows: [7, 14, 28, 56]
  smoothing: 20.0
  burn_in_days: 14

output: models/sweep/tune_dropout03.pt
extra_data:
  files: [apr_jun]
  use: train
