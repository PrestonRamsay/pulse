# Gradient-boosted trees on schedule fields plus recent late rates (network, route, stop, slot
# over 7/14/28/56 days, earlier service days only; no counts, see logreg_history_rates).
# Stop enters only through its late rates: a time-aware target encoding of the 1,163 stops.
experiment: pulse-late-3min
run_name: gbt_history
label: late
features: [route_id, direction_id, point_type, standard_type, day_type]
numeric_features: [hour, minute_of_day, day_of_week, scheduled_headway, time_point_order]
history:
  windows: [7, 14, 28, 56]
  smoothing: 20.0
  counts: false
train:
  burn_in_days: 14
model:
  type: hgb
  params: {learning_rate: 0.1, max_iter: 300, max_leaf_nodes: 31, min_samples_leaf: 100}
