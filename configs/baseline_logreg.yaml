# Logistic regression on one-hot encoded schedule features.
# OneHotEncoder(handle_unknown="ignore") so a route or stop unseen in train scores as all zeros.
experiment: pulse-late-3min
run_name: baseline_logreg
label: late
features:
  - route_id
  - direction_id
  - stop_id
  - point_type
  - standard_type
  - hour
  - day_of_week
model:
  type: logreg
  params:
    solver: lbfgs
    C: 1.0
    max_iter: 300
