# logreg_schedule plus recent late rates (network, route, stop, slot over 7/14/28/56 days,
# each row using only earlier service days) and history counts for stop and slot.
experiment: pulse-late-3min
run_name: logreg_history
label: late
features: [route_id, direction_id, stop_id, point_type, standard_type, hour, day_of_week, day_type]
numeric_features: [scheduled_headway, time_point_order]
history:
  windows: [7, 14, 28, 56]
  smoothing: 20.0
  counts: true
train:
  burn_in_days: 14
model:
  type: logreg
  params: {solver: lbfgs, C: 1.0, max_iter: 300}
