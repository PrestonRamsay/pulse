# The final model: logistic regression on schedule fields + recent late rates, trained on
# 15 April - 31 August 2026 (experiment B; April-June from data/splits/apr_jun.parquet).
# Same settings as configs/logreg_history_rates_apr_aug.yaml. Chosen on validation by the
# rule fixed before the seed results (REPORT.md §3 status note): the April-August network led
# by 0.0031 AUC over 4 seeds but peaked at epoch 1 in 3 of them. Serve with rolling 7-day
# recalibration; the threshold is picked on validation (REPORT.md §5) before any test run.
experiment: pulse-late-3min
run_name: final
label: late
features: [route_id, direction_id, stop_id, point_type, standard_type, hour, day_of_week, day_type]
numeric_features: [scheduled_headway, time_point_order]
history:
  windows: [7, 14, 28, 56]
  smoothing: 20.0
  counts: false
train:
  burn_in_days: 14
model:
  type: logreg
  params: {solver: lbfgs, C: 1.0, max_iter: 300}
extra_data:
  files: [apr_jun]
  use: train
