# gbt_history with bigger trees, a lower learning rate and more rounds, plus L2 on leaf values.
experiment: pulse-late-3min
run_name: gbt_history_deep
label: late
features: [route_id, direction_id, point_type, standard_type, day_type]
numeric_features: [hour, minute_of_day, day_of_week, scheduled_headway, time_point_order]
history:
  windows: [7, 14, 28, 56]
  smoothing: 20.0
  counts: false
train:
  burn_in_days: 14
model:
  type: hgb
  params: {learning_rate: 0.05, max_iter: 600, max_leaf_nodes: 127, min_samples_leaf: 500, l2_regularization: 1.0}
