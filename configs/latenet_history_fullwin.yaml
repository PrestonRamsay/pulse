# Experiment A: latenet_final, with April-June 2026 filling the late-rate windows only.
# Train rows unchanged (15 Jul - 31 Aug); every July row now has a full 56 days of history.
experiment: pulse-late-3min
run_name: latenet_history_fullwin
seed: 0

model:
  embedding_dims:        # size of each learned vector; vocab sizes are 155 / 1163 / 24 / 7 / 3
    route_id: 16
    stop_id: 32
    hour: 8
    day_of_week: 4
    point_type: 2
  hidden: [256, 128]     # two hidden layers
  dropout: 0.1

train:
  batch_size: 8192
  learning_rate: 0.003 
  weight_decay: 0.0
  max_epochs: 20
  patience: 3            # stop after 3 epochs without a better validation AUC
  min_delta: 0.0005      # an improvement smaller than this doesn't count
  threshold: 0.5         # for validation accuracy

history:
  windows: [7, 14, 28, 56]
  smoothing: 20.0
  burn_in_days: 14

output: models/sweep/latenet_history_fullwin.pt
extra_data:
  files: [apr_jun]
  use: history
