# Re-tuning round 2: the two one-change runs that beat latenet_history_apr_aug (0.7347) and kept
# stable training (last epoch within 0.005 of best): dropout 0.3 (0.7358) + learning rate 0.001 (0.7348).
# Validation only; seed 0.
experiment: pulse-late-3min
run_name: tune_dropout03_lr001
seed: 0

model:
  embedding_dims:        # size of each learned vector; vocab sizes are 155 / 1163 / 24 / 7 / 3
    route_id: 16
    stop_id: 32
    hour: 8
    day_of_week: 4
    point_type: 2
  hidden: [256, 128]     # two hidden layers
  dropout: 0.3

train:
  batch_size: 8192
  learning_rate: 0.001
  weight_decay: 0.0
  max_epochs: 20
  patience: 3            # stop after 3 epochs without a better validation AUC
  min_delta: 0.0005      # an improvement smaller than this doesn't count
  threshold: 0.5         # for validation accuracy

history:
  windows: [7, 14, 28, 56]
  smoothing: 20.0
  burn_in_days: 14

output: models/sweep/tune_dropout03_lr001.pt
extra_data:
  files: [apr_jun]
  use: train
